<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="晚进早出：砍掉一场戏两头的废话">
<rect width="720" height="200" fill="#f7f5f1"/>

<rect x="40" y="80" width="150" height="48" fill="url(#scene-inout-hatch)" stroke="#cfc9bd"/>
<rect x="190" y="80" width="340" height="48" fill="#efece6" stroke="#8d3a32"/>
<rect x="530" y="80" width="150" height="48" fill="url(#scene-inout-hatch)" stroke="#cfc9bd"/>
<text x="115" y="108" text-anchor="middle" fill="#5c5852" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">寒暄</text>
<text x="360" y="108" text-anchor="middle" fill="#8d3a32" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="14" font-weight="400">这场戏真正发生的事</text>
<text x="605" y="108" text-anchor="middle" fill="#5c5852" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">收尾废话</text>
<text x="190" y="160" text-anchor="middle" fill="#8d3a32" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">晚进</text>
<text x="530" y="160" text-anchor="middle" fill="#8d3a32" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">早出</text>
<defs><pattern id="scene-inout-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#cfc9bd"/></pattern></defs>

</svg>
