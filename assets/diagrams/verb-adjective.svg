<rect x="40" y="40" width="300" height="120" fill="#f7f5f1" stroke="#cfc9bd"/>
<text x="190" y="78" text-anchor="middle" fill="#5c5852" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">形容词</text>
<text x="190" y="112" text-anchor="middle" fill="#5c5852" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="16" font-weight="400">你看起来很生气</text>
<line x1="90" y1="108" x2="290" y2="108" stroke="#8d3a32" stroke-width="1.25"/>
<rect x="380" y="40" width="300" height="120" fill="#f7f5f1" stroke="#8d3a32"/>
