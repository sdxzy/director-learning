<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="三点布光俯视图：主光、辅光、轮廓光和机位">
<rect width="720" height="360" fill="#f7f5f1"/>

<rect x="80" y="36" width="560" height="280" fill="none" stroke="#cfc9bd"/>
<text x="360" y="28" text-anchor="middle" fill="#5c5852" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="12" font-weight="400">俯视</text>
<circle cx="360" cy="180" r="22" fill="#f7f5f1" stroke="#1a1916" stroke-width="1.5"/>
<text x="360" y="184" text-anchor="middle" fill="#1a1916" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="12" font-weight="400">人</text>
<g transform="translate(360.0 300.0) rotate(-90) scale(1)" fill="#f7f5f1" stroke="#1a1916" stroke-width="1.5" stroke-linejoin="round"><rect x="-16" y="-9" width="22" height="18"/><path d="M6 -6 L16 0 L6 6 Z"/><circle cx="-5" cy="-12" r="2.2" fill="#f7f5f1"/></g>
<text x="360" y="332" text-anchor="middle" fill="#5c5852" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">机位</text>
<path d="M150 70 L330 160" stroke="#8d3a32" stroke-width="1.5" fill="none" marker-end="url(#three-point-arr)"/>
<text x="150" y="60" text-anchor="middle" fill="#8d3a32" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">主光</text>
<path d="M570 80 L390 160" stroke="#1a1916" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#three-point-arr-ink)"/>
<text x="560" y="68" text-anchor="middle" fill="#5c5852" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">辅光</text>
<path d="M360 70 L360 150" stroke="#1a1916" stroke-width="1.5" fill="none" marker-end="url(#three-point-arr-ink)"/>
<text x="400" y="78" text-anchor="middle" fill="#5c5852" font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' font-size="13" font-weight="400">轮廓光</text>
<defs>
<marker id="three-point-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8d3a32"/></marker>
<marker id="three-point-arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1a1916"/></marker>
</defs>

</svg>
