<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="俯视示意：客人和店主隔着收银台面对面，两人之间的连线就是轴线。四个机位都在轴线同一侧：从客人身后拍店主的过肩、从店主身后拍客人的过肩、低角度拍客人的单人近景、拍店主的单人近景。轴线另一侧的机位被划掉，表示越轴会让人物在画面里跳边。下方是景别随紧张程度逐步收紧的示意。不是真实机位图。">
<rect width="720" height="540" fill="#f7f5f1"/>
<defs>
<marker id="nc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0 L10 5 L0 10 Z" fill="#8d3a32"/>
</marker>
<marker id="nc-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0 L10 5 L0 10 Z" fill="#1a1916"/>
</marker>
</defs>
<g font-family='"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif' fill="#1a1916">
<text x="40" y="44" font-size="17" font-weight="600">收银台两边的正反打（俯视示意）</text>
<text x="40" y="68" font-size="13" fill="#6b665d">不是真实机位图，只用来说明思路：所有机位都守在轴线的同一侧</text>

<!-- store floor -->
<rect x="60" y="92" width="600" height="270" fill="#efece6" stroke="#cfc9bd"/>
<!-- counter -->
<rect x="345" y="130" width="30" height="140" fill="#f7f5f1" stroke="#1a1916" stroke-width="1.5"/>
<text x="360" y="288" font-size="12" text-anchor="middle" fill="#6b665d">收银台</text>

<!-- axis -->
<line x1="80" y1="190" x2="640" y2="190" stroke="#8d3a32" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="636" y="180" font-size="12" text-anchor="end" fill="#8d3a32">轴线（两人视线的连线）</text>

<!-- characters -->
<circle cx="250" cy="190" r="17" fill="#1a1916"/>
<text x="250" y="150" font-size="13" text-anchor="middle">客人（Anton）</text>
<circle cx="470" cy="190" r="17" fill="#f7f5f1" stroke="#1a1916" stroke-width="2"/>
<text x="470" y="150" font-size="13" text-anchor="middle">店主</text>

<!-- camera icons: small rects with lens triangle, all below axis -->
<!-- A: OTS behind Anton looking at clerk -->
<g transform="translate(168,236) rotate(-28)">
<rect x="-14" y="-9" width="22" height="18" fill="#1a1916"/><path d="M8 -6 L18 -11 L18 11 L8 6 Z" fill="#1a1916"/>
</g>
<line x1="186" y1="226" x2="448" y2="198" stroke="#1a1916" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#nc-ink)"/>
<text x="110" y="270" font-size="12">A 过肩：从客人肩后拍店主</text>

<!-- B: OTS behind clerk looking at Anton -->
<g transform="translate(556,236) rotate(208)">
<rect x="-14" y="-9" width="22" height="18" fill="#1a1916"/><path d="M8 -6 L18 -11 L18 11 L8 6 Z" fill="#1a1916"/>
</g>
<line x1="538" y1="226" x2="272" y2="198" stroke="#1a1916" stroke-width="1" stroke-dasharray="3 4" marker-end="url(#nc-ink)"/>
<text x="498" y="270" font-size="12">B 过肩：从店主肩后拍客人</text>

<!-- C: low-angle single on Anton -->
<g transform="translate(400,312) rotate(-125)">
<rect x="-14" y="-9" width="22" height="18" fill="#8d3a32"/><path d="M8 -6 L18 -11 L18 11 L8 6 Z" fill="#8d3a32"/>
</g>
<text x="410" y="346" font-size="12" fill="#8d3a32">C 低角度单人：在店主这边拍客人，略微仰拍</text>

<!-- D: single on clerk -->
<g transform="translate(320,312) rotate(-55)">
<rect x="-14" y="-9" width="22" height="18" fill="#1a1916"/><path d="M8 -6 L18 -11 L18 11 L8 6 Z" fill="#1a1916"/>
</g>
<text x="310" y="346" font-size="12" text-anchor="end">D 单人：在客人这边拍店主</text>

<!-- crossed camera above axis -->
<g transform="translate(560,128)" opacity="0.55">
<rect x="-12" y="-8" width="20" height="16" fill="#6b665d"/><path d="M8 -5 L16 -9 L16 9 L8 5 Z" fill="#6b665d"/>
</g>
<line x1="540" y1="114" x2="580" y2="142" stroke="#8d3a32" stroke-width="2"/>
<line x1="580" y1="114" x2="540" y2="142" stroke="#8d3a32" stroke-width="2"/>
<text x="528" y="124" font-size="12" fill="#8d3a32" text-anchor="end">越过轴线到这一侧拍，人物会在画面里“跳边”</text>

<!-- shot size escalation -->
<text x="40" y="398" font-size="14" font-weight="600">话越危险，镜头越近</text>
<g font-size="12">
<rect x="40" y="414" width="140" height="80" fill="#efece6" stroke="#cfc9bd"/>
<circle cx="110" cy="452" r="6" fill="#1a1916"/><rect x="104" y="459" width="12" height="18" fill="#1a1916"/>
<text x="110" y="512" text-anchor="middle">全景：交代地点</text>
<rect x="210" y="414" width="140" height="80" fill="#efece6" stroke="#cfc9bd"/>
<circle cx="280" cy="446" r="12" fill="#1a1916"/><rect x="266" y="459" width="28" height="35" fill="#1a1916"/>
<text x="280" y="512" text-anchor="middle">中景：闲聊开始</text>
<rect x="380" y="414" width="140" height="80" fill="#efece6" stroke="#cfc9bd"/>
<circle cx="450" cy="452" r="24" fill="#1a1916"/><rect x="424" y="478" width="52" height="16" fill="#1a1916"/>
<text x="450" y="512" text-anchor="middle">近景：对峙升级</text>
<rect x="550" y="414" width="140" height="80" fill="#efece6" stroke="#8d3a32" stroke-width="1.5"/>
<circle cx="620" cy="458" r="34" fill="#1a1916"/>
<text x="620" y="512" text-anchor="middle" fill="#8d3a32">抛硬币：缓慢推近</text>
<line x1="184" y1="454" x2="206" y2="454" stroke="#8d3a32" stroke-width="1.5" marker-end="url(#nc-arrow)"/>
<line x1="354" y1="454" x2="376" y2="454" stroke="#8d3a32" stroke-width="1.5" marker-end="url(#nc-arrow)"/>
<line x1="524" y1="454" x2="546" y2="454" stroke="#8d3a32" stroke-width="1.5" marker-end="url(#nc-arrow)"/>
</g>
<text x="40" y="530" font-size="11" fill="#6b665d">自绘示意，景别顺序参考讲解视频与公开分析的描述，不是逐镜头还原。</text>
</g>
</svg>
